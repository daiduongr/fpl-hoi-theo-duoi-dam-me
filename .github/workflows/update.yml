    - cron: "0 22 23 5 *"  # GW37 chốt bonus, 23/05 22:00 UTC
    - cron: "0 18 30 5 *"  # GW38 xong, 30/05 18:00 UTC
    - cron: "0 23 30 5 *"  # GW38 chốt bonus, 30/05 23:00 UTC
    # END GW SCHEDULE
  workflow_dispatch:
    inputs:
      force:
        description: "Build lại kể cả khi không có GW mới"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-page
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_TOKEN: ${{ secrets.WORKFLOW_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build trang
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python fpl_prize_page.py
          else
            python fpl_prize_page.py --if-changed
          fi
      - name: Cập nhật lịch chạy theo lịch thi đấu
        run: python update_schedule.py
      - name: Commit nếu có thay đổi
        run: |
          if [ "$HAS_TOKEN" != "true" ] && ! git diff --quiet -- .github; then
            echo "::warning::Lịch thi đấu đã đổi nhưng thiếu secret WORKFLOW_TOKEN nên không cập nhật được lịch chạy"
            git checkout -- .github
          fi
          if git diff --quiet; then
            echo "Không có thay đổi"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898741+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            MSG="Cập nhật lịch chạy theo lịch thi đấu mới"
          else
            GW=$(python -c "import json; print(json.load(open('state.json'))['finished_gw'])")
            MSG="Cập nhật sau GW${GW}"
          fi
          git commit -am "$MSG"
          git push
