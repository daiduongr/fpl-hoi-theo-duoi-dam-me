name: Cập nhật sau mỗi GW

# Chỉ chạy vào lúc kết thúc mỗi GW (và vài giờ sau để lấy bonus đã chốt).
# Lịch bên dưới do update_schedule.py sinh từ lịch thi đấu FPL; mỗi lần chạy, nó tự
# tính lại và push nếu giờ đá thay đổi (cần secret WORKFLOW_TOKEN có quyền Workflows).
